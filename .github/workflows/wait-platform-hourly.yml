name: Wait platform hourly summary

on:
  workflow_run:
    workflows: ["Ping platform hourly summary"]
    types: [completed]

concurrency:
  group: wait-platform-hourly
  cancel-in-progress: true

jobs:
  wait:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait 55 minutes
        run: sleep 3300
