name: Ping ticket workflows

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: ping-ticket-workflows
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch run-ticket-workflows
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN secret is missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/laurenbarer49/jira-bolt-automation/dispatches \
            -d '{"event_type":"run-ticket-workflows"}'
          echo "Dispatched run-ticket-workflows"
