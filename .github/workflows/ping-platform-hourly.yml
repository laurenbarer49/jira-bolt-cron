name: Ping platform hourly summary

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Wait platform hourly summary"]
    types: [completed]

concurrency:
  group: ping-platform-hourly
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch run-platform-hourly
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN secret is missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/laurenbarer49/jira-bolt-automation/dispatches \
            -d '{"event_type":"run-platform-hourly"}'
          echo "Dispatched run-platform-hourly"
