name: Wait ticket workflows

on:
  workflow_run:
    workflows: ["Ping ticket workflows"]
    types: [completed]

concurrency:
  group: wait-ticket-workflows
  cancel-in-progress: true

jobs:
  wait:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait 25 minutes
        run: sleep 1500
