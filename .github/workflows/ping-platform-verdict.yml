name: Ping platform verdict

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ping-platform-verdict
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch run-platform-verdict
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN secret is missing"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/laurenbarer49/jira-bolt-automation/dispatches \
            -d '{"event_type":"run-platform-verdict"}'
          echo "Dispatched run-platform-verdict"
      - name: Wait 4 minutes then re-queue
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          sleep 240
          gh workflow run "Ping platform verdict" --repo laurenbarer49/jira-bolt-cron
          echo "Re-queued Ping platform verdict"
