name: Wait platform verdict

# Off-clock delay on the public repo (free minutes). When this finishes,
# Ping platform verdict starts again so we do not depend on GitHub cron.

on:
  workflow_run:
    workflows: ["Ping platform verdict"]
    types: [completed]

concurrency:
  group: wait-platform-verdict
  cancel-in-progress: true

jobs:
  wait:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait 4 minutes
        run: sleep 240
